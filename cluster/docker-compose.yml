# Local FoundationDB 8.0.0 cluster: five fdbserver processes, one per container.
# Each container has its own zoneid (its hostname), so `double` replication puts
# replicas into different containers and killing one container kills one process.
name: p09-fdb

x-fdb: &fdb
  image: foundationdb/foundationdb@sha256:ba3676ca97f9b674c571b8296a5d9009dd3e7494226a20d184a19df73be0abf9
  environment:
    FDB_CLUSTER_FILE_CONTENTS: "p09:p09@10.89.9.11:4500,10.89.9.12:4500,10.89.9.13:4500"
    FDB_NETWORKING_MODE: container
  restart: "no"

services:
  fdb1:
    <<: *fdb
    hostname: fdb1
    networks: { fdbnet: { ipv4_address: 10.89.9.11 } }
  fdb2:
    <<: *fdb
    hostname: fdb2
    networks: { fdbnet: { ipv4_address: 10.89.9.12 } }
  fdb3:
    <<: *fdb
    hostname: fdb3
    networks: { fdbnet: { ipv4_address: 10.89.9.13 } }
  fdb4:
    <<: *fdb
    hostname: fdb4
    networks: { fdbnet: { ipv4_address: 10.89.9.14 } }
  fdb5:
    <<: *fdb
    hostname: fdb5
    networks: { fdbnet: { ipv4_address: 10.89.9.15 } }

networks:
  fdbnet:
    ipam:
      config:
        - subnet: 10.89.9.0/24
